Convert length, weight, temperature, and data storage units. Everything happens in your
browser — nothing is sent anywhere.

<div id="unit-converter" class="card-wrapper card mt-4">
  <div class="card-body">
    <div class="mb-3">
      <label for="uc-category" class="form-label">Category</label>
      <select id="uc-category" class="form-select">
        <option value="length">Length</option>
        <option value="weight">Weight</option>
        <option value="temperature">Temperature</option>
        <option value="data">Data Storage</option>
      </select>
    </div>

    <p id="uc-note" class="text-muted small d-none"></p>

    <div class="row g-3 align-items-end">
      <div class="col-12 col-md-5">
        <label for="uc-value" class="form-label">Value</label>
        <input type="number" id="uc-value" class="form-control" value="1" inputmode="decimal">
      </div>

      <div class="col-12 col-md-3">
        <label for="uc-from" class="form-label">From</label>
        <select id="uc-from" class="form-select"></select>
      </div>

      <div class="col-auto d-flex justify-content-center">
        <button type="button" id="uc-swap" class="btn btn-outline-secondary" aria-label="Swap units" title="Swap units">
          <i class="fas fa-right-left"></i>
        </button>
      </div>

      <div class="col-12 col-md-3">
        <label for="uc-to" class="form-label">To</label>
        <select id="uc-to" class="form-select"></select>
      </div>
    </div>

    <div class="mt-3">
      <label for="uc-result" class="form-label">Result</label>
      <input type="text" id="uc-result" class="form-control" readonly>
    </div>
  </div>
</div>
