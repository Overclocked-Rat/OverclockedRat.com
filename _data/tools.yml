# Each tool needs: id, name, description, url
# The dashboard's "Featured tool" box (Box 3) automatically:
#   - falls back to the FIRST entry in this list by default
#   - once a visitor has used a tool, personalizes to their own most-used one
#     (tracked locally in their browser, not a global/site-wide count)
#
# Example entry — uncomment and fill in once your first tool page exists:
